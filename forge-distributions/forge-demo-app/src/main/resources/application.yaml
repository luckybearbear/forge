spring:
  application:
    name: forge-demo-app
  datasource:
    # 本地/部署经环境变量覆盖；默认 forge/forge/forge 三元组与根 compose 的 postgres 服务一致
    # （compose 实例上另建 forge_demo 库即可直连；常驻实例经 FORGE_DB_* 换成真实凭据，README）
    url: ${FORGE_DB_URL:jdbc:postgresql://localhost:5432/forge_demo}
    username: ${FORGE_DB_USERNAME:forge}
    password: ${FORGE_DB_PASSWORD:forge}
  flyway:
    enabled: true # 迁移脚本 db/migration（demo 表）；event_publication 由 Modulith schema-init 负责
  jpa:
    hibernate:
      ddl-auto: validate # 表结构唯一权威是 Flyway，JPA 只校验映射
    open-in-view: false # OSIV 请求级会话在租户上下文填充前开启——判别式解析为平台租户 "0"（租户表
                        # 恒空）；Boot 4 + Hibernate 7.4 实证 identity 登录链的 REQUIRES_NEW 新会话不足以
                        # 恢复正确判别式（appLogin 恒 IDENT-0401，关 OSIV 即恢复），认证全链路（Task 8）
                        # 要求会话一律在 setTenantId 之后开启。demo 实体无跨层懒加载，无 OSIV 依赖。
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true # event_publication 登记表（与 data-starter 低优先级默认同值，显式声明便于阅读）
server:
  port: 8080
forge:
  openapi:
    title: Forge Demo API
    description: 模块化单体演示：mold + maintenance（契约 + 事件 + 连库租户隔离 + 认证/权限/审计全链路）
    version: 1.0.0-SNAPSHOT
